name: Build Horizon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "horizon-android-part-*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check source archives
        shell: bash
        run: |
          set -euo pipefail
          for f in horizon-android-part-01.zip horizon-android-part-02.zip horizon-android-part-03.zip; do
            test -s "$f"
            unzip -t "$f"
          done

      - name: Extract Horizon source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          for f in horizon-android-part-*.zip; do
            unzip -oq "$f" -d source
          done
          test -f source/horizon-main/Cargo.toml
          test -f source/horizon-main/android-app/Cargo.toml
          test -f source/horizon-main/android/settings.gradle
          test -f source/horizon-main/android/app/build.gradle
          test -f source/horizon-main/android/app/src/main/AndroidManifest.xml

      - name: Fix Android keyboard compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/horizon-main/crates/horizon-client-input/src/keybinds.rs")
          s = p.read_text()

          old_import = "use winit::platform::modifier_supplement::KeyEventExtModifierSupplement;"
          old_method = "event.key_without_modifiers()"

          if old_import not in s:
              raise SystemExit("Expected keyboard import was not found.")
          if old_method not in s:
              raise SystemExit("Expected keyboard method was not found.")

          s = s.replace(old_import + "\n", "")
          s = s.replace(old_method, "event.logical_key.clone()")

          p.write_text(s)

          if "key_without_modifiers()" in p.read_text():
              raise SystemExit("Keyboard compatibility patch was incomplete.")

          print("Android keyboard compatibility patch applied.")
          PY

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          cd "$RUNNER_TEMP"
          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o android-tools.zip

          mkdir -p android-tools
          unzip -q android-tools.zip -d android-tools
          mv android-tools/cmdline-tools "$SDK/cmdline-tools/latest"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android Rust library
        working-directory: source/horizon-main
        shell: bash
        run: |
          set -euo pipefail
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build \
            --manifest-path android-app/Cargo.toml \
            --release

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: source/horizon-main/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="source/horizon-main/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-files
          cp "$APK" release-files/Horizon-Android-arm64.apk
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Android-APK
          path: release-files/Horizon-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: horizon-android-${{ github.run_number }}-${{ github.run_attempt }}
          name: Horizon Android Build ${{ github.run_number }}
          prerelease: true
          files: release-files/Horizon-Android-arm64.apk
