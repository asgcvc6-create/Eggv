name: Build Horizon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "horizon-android-part-*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check source archives
        shell: bash
        run: |
          set -e
          test -f horizon-android-part-01.zip
          test -f horizon-android-part-02.zip
          test -f horizon-android-part-03.zip
          unzip -t horizon-android-part-01.zip
          unzip -t horizon-android-part-02.zip
          unzip -t horizon-android-part-03.zip

      - name: Extract Horizon source
        shell: bash
        run: |
          set -e
          mkdir -p source
          for f in horizon-android-part-*.zip; do
            unzip -oq "$f" -d source
          done
          test -f source/horizon-main/Cargo.toml
          test -f source/horizon-main/android-app/Cargo.toml
          test -f source/horizon-main/android-app/src/lib.rs
          test -f source/horizon-main/android/app/build.gradle
          test -f source/horizon-main/android/app/src/main/AndroidManifest.xml

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android Rust library
        working-directory: source/horizon-main
        shell: bash
        run: |
          set -e
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build \
            --manifest-path android-app/Cargo.toml \
            --release

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: source/horizon-main/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="source/horizon-main/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK created successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Android-APK
          path: source/horizon-main/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: horizon-android-${{ github.run_number }}
          name: Horizon Android Build ${{ github.run_number }}
          prerelease: true
          files: source/horizon-main/android/app/build/outputs/apk/debug/app-debug.apk
